# Minimal Redis configuration for Dokploy (no TLS/ACL) to ensure the server starts.

bind 0.0.0.0
protected-mode no
port 6379

# Performance/persistence
maxmemory 1gb
maxmemory-policy allkeys-lru
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename appendonly.aof
appendfsync everysec
tcp-keepalive 300

# Authentication & ACL
requirepass ${REDIS_PASSWORD:-your-default-password}
aclfile /data/users.acl

# Logging
loglevel notice
logfile "/data/redis.log"

# Disable ACL for now; add later once users.acl exists.
# Authentication is handled via your Better Auth client.
